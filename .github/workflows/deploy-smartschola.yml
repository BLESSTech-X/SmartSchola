name: Deploy SmartSchola
on:
  push:
    branches: [main]
    paths:
      - 'smartschola-frontend/**'
      - '.github/workflows/deploy-smartschola.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
        working-directory: smartschola-frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: smartschola-frontend/dist
      - uses: actions/deploy-pages@v4

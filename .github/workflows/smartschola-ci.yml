name: SmartSchola CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall -q .
      - name: Run contract tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./smartschola-ci.db
        run: pytest -q

  frontend-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: [frontend, smartschola-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies and build
        working-directory: ${{ matrix.frontend }}
        run: |
          npm install --no-audit --no-fund
          npm run build

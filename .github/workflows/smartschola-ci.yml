name: SmartSchola Cloudflare CI

on:
  push:
    branches: [main, cloudflare-migration]
  pull_request:
    branches: [main]

jobs:
  cloudflare-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/src/index.js
      - name: Check migration files are present
        run: |
          test -f cloudflare/migrations/0001_smartschola_core.sql
          test -f cloudflare/migrations/0002_tenant_integrity_guards.sql
          test -f cloudflare/migrations/0003_school_operations.sql
          test -f cloudflare/migrations/0004_settings_and_messaging.sql
          test -f cloudflare/migrations/0005_profiles_website_admissions.sql

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smartschola-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: smartschola-frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: smartschola-frontend
        env:
          VITE_API_URL: https://smartschola-api.invalid
        run: npm run build

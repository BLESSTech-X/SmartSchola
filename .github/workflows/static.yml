name: Deploy SmartSchola to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'smartschola-frontend/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smartschola-frontend/package-lock.json
      - name: Install dependencies and build frontend
        working-directory: smartschola-frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY in GitHub Actions repository variables."
            exit 1
          fi
          npm install
          npm run build
          cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload built frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: smartschola-frontend/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy SmartSchola to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'smartschola-frontend/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smartschola-frontend/package-lock.json
      - name: Install dependencies and build frontend
        working-directory: smartschola-frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Missing GitHub Actions repository variable VITE_API_URL. Set it to the deployed SmartSchola API root URL (for example, https://smartschola-api.onrender.com), without /api."
            exit 1
          fi
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload built frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: smartschola-frontend/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
